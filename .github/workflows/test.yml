name: tests

# v2.1 P2-4: 测试套件入库后的 CI 门禁。
# 说明:
# - PolyXRD 面向 Windows 桌面 (单实例内核互斥量 / 渲染自愈等), runner 用 windows-latest;
# - 大型外挂数据库 (COD/PDF2) 与本地试样目录不入库, 相关用例自带 skipif 守卫,
#   CI 上自动跳过, 只回归合成数据可覆盖的部分。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite
        run: pytest -q --tb=short
