[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyxrd"
version = "2.3.0"
description = "X射线衍射仪数据分析软件 - 物相分析与Rietveld结构精修"
readme = "README.md"
# 双许可 (学术免费 / 商业需单独书面授权): SPDX 无对应标准标识符,
# 按 PEP 639 用 LicenseRef-, 条款正文见 LICENSE (英文) 与 LICENSE-CN (中文)。
license = "LicenseRef-PolyXRD-Academic-Dual"
license-files = ["LICENSE", "LICENSE-CN"]
requires-python = ">=3.10"
authors = [
    {name = "PolyXRD Team", email = "sshztx@outlook.com"},
]
keywords = [
    "XRD",
    "X-ray diffraction",
    "Rietveld refinement",
    "phase identification",
    "crystallography",
    "structure refinement",
    "materials science",
    "scientific computing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "pymatgen==2025.10.7",
    "lmfit>=1.3",
    "powerxrd>=1.0",
    "pandas>=2.0.0",
    "pyqtgraph>=0.13.0",
    "Pillow>=9.0.0",
    "platformdirs>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/PolyXRD/PolyXRD"
Repository = "https://github.com/PolyXRD/PolyXRD"
Documentation = "https://github.com/PolyXRD/PolyXRD/blob/main/README.md"
Changelog = "https://github.com/PolyXRD/PolyXRD/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/PolyXRD/PolyXRD/issues"
Releases = "https://github.com/PolyXRD/PolyXRD/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
    "ruff>=0.6.0",
]
mcp = [
    "mcp>=0.9.0",
]

[project.scripts]
polyxrd = "polyxrd.main:main"

[project.gui-scripts]
polyxrd-gui = "polyxrd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyxrd = ["i18n/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["polyxrd"]
omit = ["tests/*", "src/polyxrd/views/*"]

[tool.coverage.report]
show_missing = true

# C 组工程: ruff 静态门禁.
# 启用三个高信号严重缺陷规则 (F821 未定义名 / F601 字面字典重复键 / RUF012
# 类属性可变默认值), 与 CI 步骤 `.github/workflows/test.yml` 的
# `ruff check src/ --select F821,F601,RUF012` 完全一致
# (services/ 的 F841/F541 等更严规则尚未纳入门禁, 待单独清理批次).
[tool.ruff.lint]
select = ["F821", "F601", "RUF012"]
