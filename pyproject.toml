[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyxrd"
version = "0.15.0"
description = "X射线衍射仪数据分析软件 - 物相分析与Rietveld结构精修"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "pymatgen>=2024.1.1",
    "lmfit>=1.3",
    "powerxrd>=1.0",
    "pandas>=2.0.0",
    "pyqtgraph>=0.13.0",
    "Pillow>=9.0.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
]
mcp = [
    "mcp>=0.9.0",
]

[project.scripts]
polyxrd = "polyxrd.main:main"

[project.gui-scripts]
polyxrd-gui = "polyxrd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyxrd = ["i18n/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["polyxrd"]
omit = ["tests/*", "src/polyxrd/views/*"]

[tool.coverage.report]
show_missing = true